[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timetrace"
version = "1.0.0"
description = "时迹 / TimeTrace — local, real-time Windows application usage tracker"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "psutil>=5.9",
]

[project.scripts]
timetrace = "timeflow.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
